<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz LPIC-101 — Comandos & Caminhos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0f172a;color:#e5e7eb;line-height:1.55;padding:18px;min-height:100vh}
.container{max-width:860px;margin:0 auto}
header{background:linear-gradient(135deg,#f59e0b,#dc2626);color:#fff;padding:24px;border-radius:14px 14px 0 0;box-shadow:0 4px 18px rgba(245,158,11,.3)}
h1{font-size:22px;margin-bottom:4px;letter-spacing:-.2px}
.subtitle{opacity:.92;font-size:13.5px}
.stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.16);padding:8px 14px;border-radius:8px;font-size:12.5px;min-width:82px}
.stat b{font-size:17px;display:block;font-weight:700}
.progress{height:6px;background:rgba(255,255,255,.22);border-radius:3px;margin-top:14px;overflow:hidden}
.pbar{height:100%;background:linear-gradient(90deg,#4ade80,#22c55e);transition:width .3s;width:0}
.mode-toggle{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.mode-toggle button{padding:6px 14px;background:rgba(255,255,255,.18);border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
.mode-toggle button:hover{background:rgba(255,255,255,.28)}
.card{background:#1e293b;padding:28px;border-radius:0 0 14px 14px;box-shadow:0 2px 12px rgba(0,0,0,.35);min-height:420px}
.qnum{color:#94a3b8;font-size:12.5px;margin-bottom:10px;font-weight:600;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.badge{background:#334155;color:#cbd5e1;padding:3px 10px;border-radius:6px;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase}
.badge.cmd{background:#f59e0b;color:#1f2937}
.badge.path{background:#8b5cf6;color:#fff}
.qtext{font-size:17px;font-weight:600;margin-bottom:22px;line-height:1.55;color:#f1f5f9}
.qtext code{background:#0f172a;color:#67e8f9;padding:2px 6px;border-radius:4px;font-family:Consolas,"Courier New",monospace;font-size:14.5px}
.input-wrap{position:relative}
.text-input{width:100%;padding:18px 20px;border:2px solid #334155;border-radius:10px;background:#0f172a;color:#67e8f9;font-size:19px;font-family:Consolas,"Courier New",monospace;letter-spacing:.5px}
.text-input:focus{outline:none;border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.text-input.correct{border-color:#16a34a;background:#14532d;color:#dcfce7}
.text-input.wrong{border-color:#dc2626;background:#7f1d1d;color:#fee2e2}
.text-input::placeholder{color:#475569;font-style:italic}
.enter-hint{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#475569;font-size:12px;letter-spacing:.5px;pointer-events:none}
.feedback{margin-top:20px;padding:16px 18px;border-radius:10px;font-size:14.5px;line-height:1.55}
.feedback.ok{background:#14532d;border-left:4px solid #22c55e;color:#dcfce7}
.feedback.err{background:#78350f;border-left:4px solid #f59e0b;color:#fef3c7}
.feedback h3{margin-bottom:6px;font-size:15px;font-weight:700}
.feedback code{background:rgba(0,0,0,.35);padding:2px 7px;border-radius:4px;font-family:Consolas,"Courier New",monospace;color:#67e8f9;font-size:14px}
.feedback.ok code{color:#4ade80}
.actions{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:11px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:background .12s}
.btn-primary{background:#f59e0b;color:#1f2937}
.btn-primary:hover{background:#d97706}
.btn-secondary{background:#334155;color:#e5e7eb}
.btn-secondary:hover{background:#475569}
.btn-danger{background:#7f1d1d;color:#fee2e2}
.btn-danger:hover{background:#991b1b}
.btn:disabled{opacity:.4;cursor:not-allowed}
.menu{padding:8px 0}
.menu h2{font-size:20px;margin-bottom:8px;color:#f1f5f9}
.menu p{color:#94a3b8;font-size:14px;margin-bottom:22px;line-height:1.55}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.menu-opt{padding:22px 18px;border:2px solid #334155;border-radius:12px;background:#0f172a;color:#e5e7eb;cursor:pointer;font-family:inherit;text-align:left;transition:border-color .12s,background .12s}
.menu-opt:hover{border-color:#f59e0b;background:#1e1b4b}
.menu-opt h3{font-size:16px;margin-bottom:6px;color:#fbbf24}
.menu-opt p{color:#94a3b8;font-size:13px;margin:0}
.menu-tip{padding:14px 16px;background:#0f172a;border-left:3px solid #f59e0b;border-radius:6px;font-size:13px;color:#cbd5e1;line-height:1.55}
.finished{text-align:center;padding:40px 20px}
.finished h2{font-size:26px;margin-bottom:12px}
.finished p{font-size:15px;margin-bottom:14px;color:#cbd5e1}
.finished .actions{justify-content:center}
.history{margin-top:24px;padding-top:20px;border-top:1px solid #334155}
.history h3{font-size:13px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.history-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0f172a;border-radius:6px;margin-bottom:6px;font-size:13px}
.history-item.ok{border-left:3px solid #22c55e}
.history-item.err{border-left:3px solid #dc2626}
.history-item code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:3px;font-family:Consolas,monospace;font-size:12.5px;color:#67e8f9}
.history-item .arrow{color:#64748b}
@media(max-width:640px){body{padding:10px}.card{padding:20px}header{padding:20px}h1{font-size:18px}.qtext{font-size:15.5px}.text-input{font-size:16px;padding:14px 16px}.stat{min-width:70px;padding:7px 10px}.stat b{font-size:15px}.btn{padding:10px 16px;font-size:13px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>⌨️ Quiz LPIC-101 — Comandos &amp; Caminhos</h1>
<div class="subtitle" id="subtitle">11 questões onde você precisa digitar o comando ou caminho exato</div>
<div class="stats" id="stats" style="display:none">
<div class="stat"><b id="s-ans">0</b>Respondidas</div>
<div class="stat"><b id="s-ok">0</b>Acertos</div>
<div class="stat"><b id="s-err">0</b>Erros</div>
<div class="stat"><b id="s-pct">0%</b>Aproveitamento</div>
<div class="stat"><b id="s-rem">0</b>Restantes</div>
</div>
<div class="progress" id="progresswrap" style="display:none"><div class="pbar" id="pbar"></div></div>
<div class="mode-toggle">
<button onclick="goMenu()">🔄 Novo treino</button>
<button onclick="toggleShowHistory()" id="btn-hist">📜 Histórico</button>
</div>
</header>
<main class="card" id="main"></main>
</div>
<script>
// ============================================================
//  BANCO DE QUESTÕES — apenas digitação (comandos e caminhos)
//  Extraído de lpic101.html (11 questões do tipo texto)
// ============================================================
// Formato: { q: "pergunta", c: "resposta padrão", aliases: [...],
//            kind: "cmd" | "path", e: "explicação" }
// aliases: respostas alternativas aceitas (ex: com/sem barra final)
// ============================================================

const Q=[
{
 q:`Qual arquivo do sistema de arquivos <code>/proc</code> lista os parâmetros passados do bootloader para o kernel? (Informe APENAS o nome do arquivo, sem caminho.)`,
 c:"cmdline",
 kind:"path",
 e:`O <code>/proc/cmdline</code> mostra a linha de comando do kernel — os argumentos que o bootloader (GRUB, etc.) passou.`
},
{
 q:`Qual diretório contém arquivos de configuração para repositórios yum adicionais? (Informe o caminho COMPLETO.)`,
 c:"/etc/yum.conf",
 aliases:["/etc/yum.repos.d","/etc/yum.repos.d/"],
 kind:"path",
 e:`Gabarito do dump: <code>/etc/yum.conf</code>. Na prática, repositórios extras ficam em <code>/etc/yum.repos.d/</code> — também aceito aqui.`
},
{
 q:`Qual arquivo de configuração do System V init é comumente usado para definir o runlevel padrão? (Informe o caminho COMPLETO.)`,
 c:"/etc/inittab",
 kind:"path",
 e:`Em System V, o runlevel padrão vem da linha <code>id:N:initdefault:</code> dentro de <code>/etc/inittab</code>.`
},
{
 q:`Qual comando exibe a lista de tarefas em segundo plano do shell atual? (Informe SOMENTE o comando, sem caminho ou parâmetros.)`,
 c:"jobs",
 kind:"cmd",
 e:`<code>jobs</code> lista os trabalhos parados ou em background do shell corrente.`
},
{
 q:`Qual comando é usado para iniciar outro comando com um dado nível de <em>nice</em>? (Informe SOMENTE o comando, sem caminho ou parâmetros.)`,
 c:"nice",
 kind:"cmd",
 e:`<code>nice -n VALOR COMANDO...</code> executa o comando com uma prioridade (nice level) definida.`
},
{
 q:`Qual programa executa um comando em intervalos e atualiza a saída na tela? (Informe SOMENTE o comando, sem caminho ou parâmetros.)`,
 c:"watch",
 kind:"cmd",
 e:`<code>watch [-n SEG] COMANDO</code> reexecuta o comando e mostra o resultado a cada N segundos (padrão 2s).`
},
{
 q:`Seguindo o FHS, onde binários compilados pelo administrador devem ser colocados para ficarem disponíveis a todos os usuários? (Informe o caminho COMPLETO do diretório.)`,
 c:"/usr/local/bin/",
 aliases:["/usr/local/bin"],
 kind:"path",
 e:`<code>/usr/local/</code> é o ramo do FHS para software instalado localmente, mantido separado dos pacotes distribuídos.`
},
{
 q:`Qual comando mostra o uso atual de disco para todos os sistemas de arquivos montados? (Informe SOMENTE o comando, sem caminho ou parâmetros.)`,
 c:"df",
 kind:"cmd",
 e:`<code>df</code> (disk free) mostra espaço livre/usado por FS montado.`
},
{
 q:`Qual comando muda a prioridade de um processo já em execução? (Informe SOMENTE o comando, sem caminho ou parâmetros.)`,
 c:"renice",
 kind:"cmd",
 e:`<code>renice</code> ajusta o nice level de processos existentes por PID/usuário/grupo.`
},
{
 q:`Qual programa atualiza a base usada pelo comando <code>locate</code>? (Informe SOMENTE o comando, sem caminho ou parâmetros.)`,
 c:"updatedb",
 kind:"cmd",
 e:`<code>updatedb</code> percorre o sistema e regenera <code>/var/lib/mlocate/mlocate.db</code>.`
},
{
 q:`Qual arquivo do FS <code>/proc</code> contém a lista dos dispositivos atualmente montados? (Informe o caminho COMPLETO.)`,
 c:"/proc/mounts",
 aliases:["/proc/self/mounts"],
 kind:"path",
 e:`<code>/proc/mounts</code> (ou <code>/proc/self/mounts</code>) reflete a tabela de mounts do kernel em tempo real.`
}
];

const TOTAL=Q.length;
const KEY="lpic101_cmd_v1";

// ============================================================
//  Motor do quiz
// ============================================================
const state=load()||{phase:"menu",mode:null,order:[],i:0,answered:{},history:[],ok:0,err:0,pool:[],retry:{}};

function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startSession(mode){
 state.phase="quiz";
 state.mode=mode;        // "sequencial" | "aleatorio" | "flashcard"
 state.i=0;
 state.answered={};
 state.history=[];
 state.ok=0;state.err=0;
 state.retry={};
 const ids=Array.from({length:TOTAL},(_,i)=>i);
 state.order=(mode==="sequencial")?ids:shuffle(ids);
 state.pool=state.order.slice();
 save();render();
}
function goMenu(){
 const ans=Object.keys(state.answered).length;
 if(state.phase==="quiz" && ans>0 && !confirm("Sair do treino atual? O progresso será perdido."))return;
 state.phase="menu";state.order=[];state.i=0;state.answered={};state.history=[];state.ok=0;state.err=0;state.pool=[];state.retry={};
 save();render();
}
function reset(){if(!confirm("Zerar todo o progresso?"))return;localStorage.removeItem(KEY);location.reload()}

function updateStats(){
 const ans=state.history.length;
 const pct=ans?Math.round(state.ok*100/ans):0;
 const stats=document.getElementById("stats"),progWrap=document.getElementById("progresswrap"),sub=document.getElementById("subtitle");
 if(state.phase==="menu"){
  stats.style.display="none";progWrap.style.display="none";
  sub.textContent="11 questões onde você precisa digitar o comando ou caminho exato";
 }else{
  stats.style.display="flex";progWrap.style.display="block";
  const modeTxt=state.mode==="flashcard"?"Flashcard (repete até acertar)":state.mode==="sequencial"?"Sequencial":"Aleatório";
  sub.textContent=`Modo: ${modeTxt} · Enter envia a resposta`;
  const target=state.mode==="flashcard"?TOTAL:state.order.length;
  const done=state.mode==="flashcard"?Object.keys(state.answered).filter(k=>state.answered[k]).length:state.i;
  document.getElementById("s-ans").textContent=ans;
  document.getElementById("s-ok").textContent=state.ok;
  document.getElementById("s-err").textContent=state.err;
  document.getElementById("s-pct").textContent=pct+"%";
  document.getElementById("s-rem").textContent=Math.max(0,target-done);
  document.getElementById("pbar").style.width=(target?done*100/target:0)+"%";
 }
}

function render(){
 updateStats();
 const main=document.getElementById("main");
 if(state.phase==="menu"){renderMenu(main);return}
 // flashcard: acabou quando todos foram acertados
 if(state.mode==="flashcard"){
  const todosAcertados=Object.keys(state.answered).length===TOTAL && Object.values(state.answered).every(v=>v===true);
  if(todosAcertados){renderFinished(main);return}
  if(state.i>=state.pool.length)state.i=0;  // volta ao começo do pool
 }else{
  if(state.i>=state.order.length){renderFinished(main);return}
 }
 renderQuestion(main);
}

function renderQuestion(main){
 const qi=currentQi();
 const q=Q[qi];
 const already=state.history.find(h=>h.qi===qi && h.correct);
 const total=state.mode==="flashcard"?TOTAL:state.order.length;
 const done=state.mode==="flashcard"?Object.keys(state.answered).filter(k=>state.answered[k]).length:state.i;
 const retryCount=state.retry[qi]||0;
 const retryBadge=retryCount>0?`<span style="color:#f59e0b;font-size:11.5px;margin-left:8px">⟳ ${retryCount}ª tentativa</span>`:"";
 let html=`<div class="qnum">
  <span>Questão ${done+1} de ${total} · Original #${qi+1}${retryBadge}</span>
  <span class="badge ${q.kind}">${q.kind==="cmd"?"COMANDO":"CAMINHO"}</span>
 </div>`;
 html+=`<div class="qtext">${q.q}</div>`;
 html+=`<div class="input-wrap">
  <input type="text" id="txtin" class="text-input" placeholder="${q.kind==="cmd"?"digite o comando...":"digite o caminho..."}" autocomplete="off" spellcheck="false" autocapitalize="off">
  <span class="enter-hint">↵ Enter</span>
 </div>`;
 html+=`<div class="feedback" id="fb" style="display:none"></div>`;
 html+=`<div class="actions">
  <button class="btn btn-primary" onclick="submitAnswer()">Confirmar</button>
  <button class="btn btn-secondary" onclick="skip()">Pular</button>
  <button class="btn btn-danger" onclick="reset()" style="margin-left:auto">Zerar</button>
 </div>`;
 if(state.history.length>0){
  html+=renderHistory();
 }
 main.innerHTML=html;
 const inp=document.getElementById("txtin");
 inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submitAnswer()}});
 setTimeout(()=>inp.focus(),50);
}

function renderHistory(){
 if(!showHistory)return "";
 const items=state.history.slice().reverse().slice(0,8).map(h=>{
  const q=Q[h.qi];
  const curto=stripTags(q.q).replace(/\(.*$/,"").trim().substring(0,70)+"...";
  return `<div class="history-item ${h.correct?"ok":"err"}">
   ${h.correct?"✓":"✗"} <code>${escapeHTML(h.given)}</code>
   ${h.correct?"":`<span class="arrow">→ correto:</span> <code>${escapeHTML(q.c)}</code>`}
   <span style="margin-left:auto;color:#64748b;font-size:11.5px">${curto}</span>
  </div>`;
 }).join("");
 return `<div class="history"><h3>Últimas respostas</h3>${items}</div>`;
}
function stripTags(s){return (""+s).replace(/<[^>]+>/g,"")}
function escapeHTML(s){return (""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

let showHistory=true;
function toggleShowHistory(){
 showHistory=!showHistory;
 document.getElementById("btn-hist").style.opacity=showHistory?"1":"0.5";
 if(state.phase==="quiz")render();
}

function currentQi(){
 if(state.mode==="flashcard")return state.pool[state.i];
 return state.order[state.i];
}
function normalize(s){
 return (""+s).trim().toLowerCase().replace(/\s+/g," ");
}
function checkAnswer(q,got){
 const g=normalize(got);
 if(!g)return false;
 const gold=[q.c].concat(q.aliases||[]);
 for(const a of gold){
  const n=normalize(a);
  if(g===n)return true;
  // aceita com/sem barra final em caminhos
  if(q.kind==="path"){
   if(g===n.replace(/\/+$/,""))return true;
   if(g.replace(/\/+$/,"")===n)return true;
   if(g+"/"===n)return true;
   if(g===n+"/")return true;
  }
 }
 return false;
}

function submitAnswer(){
 const inp=document.getElementById("txtin");
 const val=inp.value;
 if(!normalize(val))return;
 const qi=currentQi();
 const q=Q[qi];
 const correct=checkAnswer(q,val);
 state.history.push({qi,given:val,correct,ts:Date.now()});
 if(correct){
  state.ok++;
  state.answered[qi]=true;
  inp.disabled=true;inp.classList.add("correct");
  showFB(qi,true);
  // avança após mostrar feedback
  setTimeout(()=>{advance(qi,true);save();render()},900);
 }else{
  state.err++;
  state.answered[qi]=state.answered[qi]||false;
  state.retry[qi]=(state.retry[qi]||0)+1;
  inp.disabled=true;inp.classList.add("wrong");
  showFB(qi,false);
  // mostra botão "próxima" ao invés de auto-avançar (pra absorver)
  const act=document.querySelector(".actions");
  act.innerHTML=`<button class="btn btn-primary" onclick="advance(${qi},false);save();render()">Próxima →</button>
   <button class="btn btn-danger" onclick="reset()" style="margin-left:auto">Zerar</button>`;
 }
 save();
 updateStats();
}

function advance(qi,wasCorrect){
 if(state.mode==="flashcard"){
  if(wasCorrect){
   // remove do pool
   state.pool=state.pool.filter(x=>x!==qi);
   if(state.pool.length===0){
    // acabou
    state.i=0;
    return;
   }
   if(state.i>=state.pool.length)state.i=0;
  }else{
   // avança no pool (deixa pra retentar depois)
   state.i=(state.i+1)%state.pool.length;
  }
 }else{
  state.i++;
 }
}

function skip(){
 state.i++;
 save();render();
}

function showFB(qi,correct){
 const q=Q[qi];
 const fb=document.getElementById("fb");
 fb.className="feedback "+(correct?"ok":"err");
 if(correct){
  fb.innerHTML=`<h3>✓ Correto!</h3>${q.e||""}`;
 }else{
  fb.innerHTML=`<h3>✗ Incorreto</h3>Resposta certa: <code>${escapeHTML(q.c)}</code>${q.aliases?` <span style="opacity:.75">(também aceito: ${q.aliases.map(a=>`<code>${escapeHTML(a)}</code>`).join(", ")})</span>`:""}<br><br>${q.e||""}`;
 }
 fb.style.display="block";
}

function renderMenu(main){
 main.innerHTML=`<div class="menu">
  <h2>⌨️ Treino de digitação — Comandos & Caminhos</h2>
  <p>São <b>${TOTAL} questões</b> extraídas do banco LPIC-101 onde a resposta é um comando ou caminho exato (sem alternativas A/B/C/D/E). Escolha o modo de treino:</p>
  <div class="menu-grid">
   <button class="menu-opt" onclick="startSession('flashcard')">
    <h3>🎴 Flashcard</h3>
    <p>Modo recomendado. Questões se repetem em ordem aleatória até você acertar TODAS. Perfeito pra memorizar.</p>
   </button>
   <button class="menu-opt" onclick="startSession('aleatorio')">
    <h3>🎲 Aleatório (1x)</h3>
    <p>Passa por todas as 11 questões uma vez só, em ordem embaralhada. Como um simulado.</p>
   </button>
   <button class="menu-opt" onclick="startSession('sequencial')">
    <h3>📋 Sequencial</h3>
    <p>Vai pelas 11 na ordem original. Útil pra revisar devagar.</p>
   </button>
  </div>
  <div class="menu-tip">💡 <b>Como funciona:</b> você digita o comando/caminho e aperta <b>Enter</b>. Acertou → avança sozinho em 1s. Errou → mostra a resposta e você clica em "Próxima". <b>Diferenças de maiúscula/minúscula</b> e barra final em caminhos são aceitas automaticamente.</div>
 </div>`;
}

function renderFinished(main){
 const ans=state.history.length;
 const pct=ans?Math.round(state.ok*100/ans):0;
 const nivel=pct>=90?{txt:"🏆 Perfeito!",cor:"#22c55e"}:pct>=70?{txt:"🎉 Muito bom!",cor:"#4ade80"}:pct>=50?{txt:"👍 Pode melhorar",cor:"#f59e0b"}:{txt:"⚠ Precisa treinar mais",cor:"#dc2626"};
 const totalTentativas=Object.keys(state.retry).reduce((s,k)=>s+state.retry[k],0);
 main.innerHTML=`<div class="finished">
  <h2 style="color:${nivel.cor}">${nivel.txt}</h2>
  <p>Modo: <b>${state.mode==="flashcard"?"Flashcard":state.mode==="aleatorio"?"Aleatório":"Sequencial"}</b></p>
  <p>Respondidas: <b>${ans}</b> · Acertos: <b>${state.ok}</b> · Erros: <b>${state.err}</b> · Aproveitamento: <b>${pct}%</b></p>
  ${totalTentativas>0?`<p style="color:#94a3b8;font-size:13.5px">Você errou ${totalTentativas}x antes de acertar as questões difíceis.</p>`:""}
  <div class="actions">
   <button class="btn btn-primary" onclick="startSession('flashcard')">🔁 Repetir no modo Flashcard</button>
   <button class="btn btn-secondary" onclick="startSession('aleatorio')">🎲 Novo treino aleatório</button>
   <button class="btn btn-secondary" onclick="goMenu()">🏠 Menu</button>
   <button class="btn btn-danger" onclick="reset()">Zerar tudo</button>
  </div>
  ${renderErrorsSummary()}
 </div>`;
}

function renderErrorsSummary(){
 // agrupa por qi: quantas vezes errou cada
 const errs={};
 state.history.filter(h=>!h.correct).forEach(h=>{
  errs[h.qi]=(errs[h.qi]||0)+1;
 });
 const ids=Object.keys(errs).map(Number).sort((a,b)=>errs[b]-errs[a]);
 if(ids.length===0)return `<p style="margin-top:20px;color:#22c55e;font-size:14px">✓ Zero erros neste treino.</p>`;
 const items=ids.map(qi=>{
  const q=Q[qi];
  const curto=stripTags(q.q).replace(/\(.*$/,"").trim();
  return `<div class="history-item err" style="text-align:left">
   <span style="font-weight:700;color:#fca5a5">${errs[qi]}x</span>
   <span style="flex:1">${curto}</span>
   <span class="arrow">→</span> <code>${escapeHTML(q.c)}</code>
  </div>`;
 }).join("");
 return `<div class="history" style="text-align:left;max-width:720px;margin:24px auto 0"><h3>Questões onde você mais errou</h3>${items}</div>`;
}

document.addEventListener("keydown",e=>{
 if(state.phase!=="quiz")return;
 if(e.key==="Enter"){
  const act=document.querySelector(".actions .btn-primary");
  if(act && act.textContent.includes("Próxima")){act.click()}
 }
});
render();
</script>
</body>
</html>
